<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f6f8;--white:#fff;--border:#dde3ea;--border2:#c8d0da;
  --green:#1a6b3a;--green2:#22863a;
  --blue:#1a56db;--purple:#7c3aed;--purple2:#6d28d9;
  --teal:#0d9488;--teal2:#0f766e;
  --text:#1a1f2e;--text2:#4a5568;--text3:#8a95a3;
  --red:#dc2626;--gold:#d97706;
  --shadow:0 1px 4px rgba(0,0,0,.08);--radius:8px;
}
html{width:100%;height:100%}
body{font-family:'Noto Sans Thai','Sarabun',sans-serif;background:var(--bg);color:var(--text);width:100%;min-height:100vh;-webkit-text-size-adjust:100%}
input,select,textarea,button{font-family:inherit}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#f0f0f0}::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}
.page{display:none}.page.active{display:block}
#page-login{display:none;min-height:100vh;background:radial-gradient(circle at 84% 86%,rgba(116,224,157,.72) 0,rgba(116,224,157,.32) 20%,rgba(116,224,157,0) 42%),radial-gradient(circle at 12% 16%,rgba(181,233,204,.55) 0,rgba(181,233,204,0) 34%),linear-gradient(135deg,#f2f8f4 0%,#eaf3f8 48%,#f8fbf8 100%);padding:40px 16px}
#page-login.active{display:flex;align-items:center;justify-content:center}
.login-center{width:100%;display:flex;justify-content:center;align-items:center}
.login-shell{display:grid;grid-template-columns:minmax(320px,1.08fr) minmax(320px,.92fr);width:100%;max-width:1040px;min-height:580px;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 28px 80px rgba(32,71,54,.22)}
.login-brand{position:relative;overflow:hidden;padding:42px;color:#fff;background:linear-gradient(150deg,#b7f3ce 0%,#55cd8e 42%,#0d9b82 100%);display:flex;flex-direction:column;justify-content:center}
.login-brand::before{content:'';position:absolute;inset:-18% -28% auto auto;width:360px;height:360px;border-radius:50%;background:rgba(255,255,255,.22)}
.login-brand::after{content:'';position:absolute;left:-110px;bottom:-130px;width:320px;height:320px;border-radius:50%;background:rgba(15,118,110,.22)}
.login-window-dots{position:absolute;top:18px;left:22px;display:flex;gap:8px;z-index:1}
.brand-dot{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.72)}
.brand-dot:nth-child(2){background:#d9f99d}.brand-dot:nth-child(3){background:#86efac}
.brand-mark{position:relative;z-index:1;width:62px;height:62px;border-radius:16px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.34);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;letter-spacing:.5px;box-shadow:inset 0 1px 0 rgba(255,255,255,.3);margin-bottom:26px}
.brand-kicker{position:relative;z-index:1;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.82);margin-bottom:9px}
.login-brand h1{position:relative;z-index:1;font-size:44px;line-height:1.05;font-weight:800;margin-bottom:14px;text-shadow:0 8px 22px rgba(0,0,0,.14)}
.brand-copy{position:relative;z-index:1;font-size:17px;line-height:1.8;font-weight:500;max-width:440px;color:rgba(255,255,255,.96)}
.brand-note{position:relative;z-index:1;margin-top:32px;display:grid;gap:12px}
.brand-note-row{display:flex;align-items:center;gap:12px;padding:13px 15px;border:1px solid rgba(255,255,255,.22);border-radius:12px;background:rgba(255,255,255,.12);backdrop-filter:blur(8px)}
.brand-note-icon{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-weight:800}
.brand-note-row span:last-child{font-size:13px;font-weight:600;color:rgba(255,255,255,.9)}
.login-box{background:#fff;border-radius:0;padding:52px 44px;width:100%;max-width:none;box-shadow:none;display:flex;flex-direction:column;justify-content:center}
.login-logo{text-align:center;margin-bottom:24px}
.login-logo .icon{font-size:38px;display:block;margin-bottom:7px}
.login-logo-img{width:70px;height:70px;object-fit:contain;display:block;margin:0 auto 8px;filter:drop-shadow(0 8px 16px rgba(18,76,43,.12))}
.login-logo h1{font-size:21px;font-weight:700;color:var(--green)}
.login-logo p{font-size:12px;color:var(--text3);margin-top:2px}
.ltabs{display:flex;gap:2px;background:#f0f3f7;border-radius:8px;padding:3px;margin-bottom:20px}
.ltab{flex:1;padding:7px 4px;border:none;border-radius:6px;background:transparent;color:var(--text2);font-size:12px;font-weight:500;cursor:pointer;transition:.2s;white-space:nowrap}
.ltab.active{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.lpanel{display:none}.lpanel.active{display:block}
.lbl{display:block;font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.inp{width:100%;padding:10px 12px;border:1.5px solid var(--border2);border-radius:8px;font-size:14px;color:var(--text);background:#fff;outline:none;transition:.2s;margin-bottom:11px}
.inp:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(26,107,58,.1)}
.lbtn{width:100%;padding:12px;border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:.2s;margin-top:3px}
.lbtn:hover{opacity:.9;transform:translateY(-1px)}
.lerr{color:var(--red);font-size:12px;margin-top:4px;text-align:center;display:none}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 22px;color:#fff;position:sticky;top:0;z-index:200;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.topbar.green-bar{background:var(--green)}.topbar.purple-bar{background:var(--purple)}
.tb-brand{font-size:17px;font-weight:700}
.tb-right{display:flex;align-items:center;gap:10px}
.tb-badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.15)}
.tb-name{font-size:13px;opacity:.9}
.tb-btn{padding:6px 13px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:6px;color:#fff;font-size:12px;cursor:pointer;transition:.2s}
.tb-btn:hover{background:rgba(255,255,255,.28)}
.admin-wrap{width:100%;max-width:100%;margin:0;padding:22px}
.anav{display:flex;gap:2px;background:#e8ecf0;border-radius:9px;padding:3px;margin-bottom:22px;flex-wrap:wrap}
.anavbtn{padding:8px 16px;border:none;border-radius:7px;background:transparent;color:var(--text2);font-size:13px;font-weight:500;cursor:pointer;transition:.2s;white-space:nowrap}
.anavbtn.active{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.apanel{display:none}.apanel.active{display:block}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.card-hdr{padding:13px 17px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-ttl{font-size:14px;font-weight:700}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:11px;margin-bottom:18px}
.stat-c{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px;position:relative;overflow:hidden}
.stat-c::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.stat-c.green::before{background:var(--green)}.stat-c.blue::before{background:var(--blue)}.stat-c.gold::before{background:var(--gold)}.stat-c.red::before{background:var(--red)}.stat-c.purple::before{background:var(--purple)}.stat-c.teal::before{background:var(--teal)}
.stat-ico{font-size:22px;margin-bottom:7px}.stat-val{font-size:24px;font-weight:700}.stat-lbl{font-size:12px;color:var(--text3);margin-top:2px}
.searchbar{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--border2);border-radius:8px;padding:9px 14px;margin-bottom:13px}
.searchbar:focus-within{border-color:var(--green)}
.searchbar input{flex:1;border:none;outline:none;font-size:14px;color:var(--text)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{padding:9px 13px;font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.8px;text-align:left;background:#f8fafc;border-bottom:1.5px solid var(--border)}
.tbl td{padding:10px 13px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#f8fcf9}
.avatar{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.av-green{background:linear-gradient(135deg,var(--green),#14a84e)}
.av-purple{background:linear-gradient(135deg,var(--purple),#a855f7)}
.av-teal{background:linear-gradient(135deg,var(--teal),#2dd4bf)}
.abtn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border:1px solid var(--border2);border-radius:7px;background:#f8fafc;color:var(--text2);font-size:12px;font-weight:700;cursor:pointer;transition:.2s}
.abtn:hover{background:#eef2f7;border-color:#94a3b8;color:var(--text);box-shadow:0 4px 12px rgba(15,23,42,.1)}
.abtn.g{background:var(--green);border-color:transparent;color:#fff}.abtn.g:hover{background:#145c30;color:#fff}
.abtn.p{background:var(--purple);border-color:transparent;color:#fff}.abtn.p:hover{background:var(--purple2);color:#fff}
.abtn.b{background:var(--blue);border-color:transparent;color:#fff}.abtn.b:hover{background:#1446b0;color:#fff}
.abtn.t{background:var(--teal);border-color:transparent;color:#fff}.abtn.t:hover{background:var(--teal2);color:#fff}
.abtn:disabled{background:#e2e8f0;border-color:#cbd5e1;color:#64748b;opacity:1;cursor:not-allowed;box-shadow:none;transform:none}
.ibtn{width:28px;height:28px;border:1px solid var(--border2);border-radius:6px;background:#fff;color:var(--text2);font-size:12px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center}
.ibtn.edit:hover{border-color:var(--blue);color:var(--blue)}.ibtn.del:hover{border-color:var(--red);color:var(--red)}
.ibtn.perm:hover{border-color:var(--purple);color:var(--purple)}
.ibtn.print:hover{border-color:var(--teal);color:var(--teal)}
.pass-cell{display:inline-flex;align-items:center;gap:6px;min-width:112px}
.pass-value{font-family:monospace;font-size:12px;color:var(--text);max-width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pass-mask{letter-spacing:1px;color:var(--text3)}
.pass-toggle{width:28px;height:28px;border:1px solid var(--border2);border-radius:6px;background:#fff;color:var(--text2);font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:.2s}
.pass-toggle:hover{border-color:var(--green);color:var(--green)}
.password-input-wrap{display:flex;align-items:center;gap:7px}
.password-input-wrap .finp{flex:1;min-width:0}
.password-input-wrap .pass-toggle{flex:0 0 40px;width:40px;height:40px}
.password-field-note{font-size:10px;color:var(--text3);line-height:1.4;margin-top:4px}
.meeting-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.meeting-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px;box-shadow:var(--shadow)}
.meeting-meta{font-size:12px;color:var(--text3);margin-bottom:8px}
.meeting-title{font-size:14px;font-weight:700;margin-bottom:9px}
.meeting-block{font-size:12px;color:var(--text2);line-height:1.65;margin-top:8px}
.meeting-block strong{display:block;color:var(--text);font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px}
.success-icon{width:48px;height:48px;border-radius:50%;background:#dcfce7;color:#15803d;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 12px}
.badge-yr{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:700}
.yr1{background:#dbeafe;color:#1e40af}.yr2{background:#dcfce7;color:#166534}
.yr3{background:#fef9c3;color:#854d0e}.yr4{background:#fce7f3;color:#9d174d}.yr5{background:#e5e7eb;color:#374151}.yr6{background:#cffafe;color:#155e75}
.score-year-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.score-year-tab{padding:7px 13px;border:1.5px solid var(--border2);border-radius:7px;background:#fff;color:var(--text2);font-size:12px;font-weight:700;cursor:pointer;transition:.2s}
.score-year-tab.active{background:var(--green);border-color:var(--green);color:#fff}
.score-year-tab:hover:not(.active){border-color:var(--green);color:var(--green)}
.modal-ov{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.5);align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto}
.modal-ov.open{display:flex;animation:fadeIn .15s ease}
.modal{background:#fff;border-radius:14px;padding:26px;width:100%;max-width:640px;margin:auto;position:relative;animation:fadeUp .2s ease}
.assess-wide-modal{max-width:1180px!important;width:calc(100vw - 32px)}
#assessment-template-modal .assess-wide-modal{max-width:1440px!important;max-height:calc(100vh - 32px);margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
#assessment-template-body{min-height:0;display:flex;flex:1;flex-direction:column}
.template-builder-shell{display:grid;grid-template-columns:minmax(0,.9fr) minmax(430px,1.1fr);gap:14px;min-height:0;flex:1}
.template-builder-editor,.template-builder-preview{min-height:0;overflow-y:auto;border:1px solid var(--border);border-radius:8px}
.template-builder-editor{padding:14px;background:#fbfcfe}
.template-builder-preview{background:#eef2f7;padding:14px}
.template-builder-preview-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;color:var(--text2);font-size:12px;font-weight:800}
.template-builder-preview-canvas{background:#fff;border:1px solid #d7dee8;border-radius:8px;padding:14px;box-shadow:0 10px 24px rgba(15,23,42,.08)}
.template-builder-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;margin-top:12px;border-top:1px solid var(--border)}
.template-builder-footer .mbtns{margin:0;min-width:min(100%,430px)}
.template-builder-preview-only .template-builder-shell{grid-template-columns:1fr}
.template-builder-preview-only .template-builder-editor{display:none}
.template-builder-preview-only .template-builder-preview{display:block}
.template-preview-table{width:100%;border-collapse:collapse;table-layout:fixed}
.template-preview-table th,.template-preview-table td{border:1px solid #d8dee8;padding:8px;font-size:12px}
.template-preview-table th{background:#f6f8fb;color:var(--text2);font-weight:800}
.template-preview-table .topic-cell{width:auto;text-align:left;line-height:1.45}
.template-preview-choice{text-align:center;width:72px}
.template-preview-choice input{width:16px;height:16px;accent-color:var(--teal)}
.template-level-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:7px}
.template-level-card{padding:9px 7px;border:1.5px solid var(--border2);border-radius:7px;background:#fff;text-align:center}
.template-level-card strong{display:block;font-size:13px}.template-level-card span{display:block;margin-top:2px;font-size:10px;color:var(--text3);line-height:1.35}
.template-uss-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.65fr);gap:12px;padding:12px;border-top:1px solid var(--border);align-items:start}
@media(max-width:900px){
  #assessment-template-modal .assess-wide-modal{width:calc(100vw - 16px);max-height:calc(100vh - 16px);padding:16px 12px}
  .template-builder-shell{display:block}.template-builder-preview{display:none}.template-builder-preview-only .template-builder-preview{display:block}
  .template-builder-editor,.template-builder-preview{max-height:calc(100vh - 190px)}
  .template-builder-footer{align-items:stretch;flex-direction:column}.template-builder-footer .mbtns{min-width:0;width:100%}
  .template-preview-table{min-width:0!important;table-layout:fixed}.template-preview-table .template-preview-choice{width:42px;padding:6px 3px}.template-preview-table .topic-cell{width:auto;overflow-wrap:anywhere}
  .template-uss-row{grid-template-columns:1fr!important}
}
.unit-trainee-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.unit-trainee-card{border:1.5px solid var(--border);background:#fff;border-radius:8px;padding:10px;cursor:pointer;transition:.18s;text-align:center;min-height:178px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.unit-trainee-card:hover{border-color:var(--teal);box-shadow:0 4px 14px rgba(20,184,166,.12);transform:translateY(-1px)}
.unit-trainee-card.sel{border-color:var(--teal);background:#f0fdfa;box-shadow:0 0 0 2px rgba(20,184,166,.18)}
.unit-trainee-card.unmatched{cursor:not-allowed;opacity:.62;background:#f8fafc}
.unit-trainee-photo{width:92px;height:112px;border-radius:6px;background:linear-gradient(135deg,var(--teal),var(--green));color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;overflow:hidden;margin-bottom:8px}
.unit-trainee-photo img{width:100%;height:100%;object-fit:cover;display:block}
.unit-trainee-name{font-size:12px;font-weight:800;color:var(--text);line-height:1.35}
.unit-trainee-meta{font-size:10px;color:var(--text3);line-height:1.35;margin-top:2px}
.modal-ttl{font-size:16px;font-weight:700;margin-bottom:18px}
.mclose{position:absolute;top:14px;right:14px;width:28px;height:28px;background:#f0f3f7;border:none;border-radius:7px;cursor:pointer;font-size:14px;color:var(--text2)}
.mclose:hover{background:#fee2e2;color:var(--red)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.fgrp{margin-bottom:11px}
.flbl{display:block;font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.finp{width:100%;padding:9px 11px;border:1.5px solid var(--border2);border-radius:7px;font-size:13px;color:var(--text);outline:none;transition:.2s}
.finp:focus{border-color:var(--green)}
textarea.finp{resize:vertical;min-height:60px}
.fdiv{height:1px;background:var(--border);margin:13px 0}
.mbtns{display:flex;gap:10px;margin-top:16px}
.mbtn-cancel{flex:1;padding:10px;background:#f0f3f7;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer}
.mbtn-save{flex:2;padding:10px;border:none;border-radius:8px;color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.mbtn-save.g{background:var(--green)}.mbtn-save.g:hover{background:#145c30}
.mbtn-save.p{background:var(--purple)}.mbtn-save.p:hover{background:var(--purple2)}
.mbtn-save.t{background:var(--teal)}.mbtn-save.t:hover{background:var(--teal2)}
.sec-hdr-green{padding:10px 16px;background:var(--green);color:#fff;border-radius:8px 8px 0 0;font-size:13px;font-weight:700}
.score-entry-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.se-card{background:#fff;border:1.5px solid var(--border);border-radius:8px;overflow:hidden}
.se-card-hdr{padding:10px 13px;background:#f8fafc;border-bottom:1px solid var(--border);font-size:12px;font-weight:700}
.se-body{padding:13px}
.se-main-row{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.score-main-inp{width:96px;padding:7px 9px;border:1.5px solid var(--border2);border-radius:8px;font-size:17px;font-weight:700;text-align:center;color:var(--green);outline:none;transition:.2s}
.score-main-inp:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(26,107,58,.1)}
.score-max-lbl{font-size:12px;color:var(--text3)}
.bar-wrap{flex:1;height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .5s ease}
.stats-row-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:9px}
.stat-mini{display:flex;flex-direction:column;gap:2px}
.stat-mini label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase}
.stat-mini input{width:100%;padding:4px 6px;border:1px solid var(--border2);border-radius:5px;font-size:11px;text-align:center;outline:none}
.stat-mini input:focus{border-color:var(--green)}
.subs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:5px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.sub-box{background:#f8fafc;border:1px solid var(--border);border-radius:6px;padding:7px}
.sub-lbl{font-size:10px;color:var(--text3);margin-bottom:4px;font-weight:600}
.sub-head{display:flex;align-items:center;gap:5px;margin-bottom:5px}
.sub-label-inp{flex:1;min-width:0;border:none;background:transparent;font-size:10px;color:var(--text2);font-weight:700;outline:none}

.adv-assess-top{display:flex;align-items:flex-start;gap:11px}
.adv-assess-icon{width:42px;height:42px;border-radius:8px;background:#f0fdfa;color:var(--teal2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.adv-assess-title{font-size:14px;font-weight:800;line-height:1.35}
.adv-assess-sub{font-size:11px;color:var(--text3);margin-top:3px}
.adv-assess-action{font-size:12px;font-weight:800;color:var(--teal2);align-self:flex-start}
.arc-avatar{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;margin-bottom:10px;background:linear-gradient(135deg,var(--purple),#a855f7)}
.arc-avatar img{width:100%;height:100%;object-fit:cover;display:block;border-radius:10px}
.arc-name{font-size:14px;font-weight:700;margin-bottom:3px}
.arc-sub{font-size:12px;color:var(--text2)}
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);border-radius:7px;color:#fff;font-size:13px;cursor:pointer;transition:.2s;margin-right:10px}
.back-btn:hover{background:rgba(255,255,255,.3)}
.empty-st{text-align:center;padding:28px;color:var(--text3);font-size:13px}
.toast{position:fixed;bottom:20px;right:20px;z-index:9999;background:#1a1f2e;color:#fff;border-radius:10px;padding:11px 16px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.3);transform:translateY(60px);opacity:0;transition:.3s ease;max-width:270px}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{background:#14532d}.toast.error{background:#7f1d1d}
.sheet-save-alert{position:fixed;left:18px;right:18px;bottom:18px;z-index:9998;display:none;align-items:flex-start;gap:12px;max-width:760px;margin:0 auto;padding:13px 14px;border:1.5px solid #fecaca;border-radius:10px;background:#fff7f7;box-shadow:0 12px 34px rgba(127,29,29,.22);color:#7f1d1d}
.sheet-save-alert.show{display:flex}
.sheet-save-alert-icon{width:28px;height:28px;border-radius:8px;background:#fee2e2;display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0}
.sheet-save-alert-body{flex:1;min-width:0;font-size:12px;line-height:1.65}
.sheet-save-alert-title{font-size:13px;font-weight:800;color:#991b1b;margin-bottom:2px}
.sheet-save-alert-detail{word-break:break-word;color:#7f1d1d}
.sheet-save-alert-meta{font-size:11px;color:#b91c1c;margin-top:2px}
.sheet-save-alert-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.sheet-save-alert button{border:none;border-radius:7px;padding:7px 10px;font-size:12px;font-weight:700;cursor:pointer}
.sheet-save-alert-retry{background:#b91c1c;color:#fff}
.sheet-save-alert-close{background:#fee2e2;color:#7f1d1d}
@media(max-width:640px){.sheet-save-alert{left:10px;right:10px;bottom:10px;flex-direction:column}.sheet-save-alert-actions{width:100%;justify-content:flex-start}}
#app-root{position:relative;width:100%;min-height:100vh;overflow-x:hidden}

/* ═══ PEDIATRIC ASSESSMENT FORM STYLES ═══ */
.ped-domain-tbl{border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-top:4px}
.ped-domain-row{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border);align-items:flex-start}
.ped-domain-row:last-child{border-bottom:none}
.ped-domain-info{flex:1;min-width:0}
.ped-domain-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px}
.ped-domain-desc{font-size:11px;color:var(--text3);line-height:1.5}
.ped-domain-actions{width:340px;flex-shrink:0;display:flex;flex-direction:column;gap:5px}
.ped-rating-group{display:flex;gap:4px}
.ped-rbtn{padding:5px 10px;border:1.5px solid var(--border2);border-radius:6px;background:#fff;font-size:11px;font-weight:600;cursor:pointer;transition:.15s;color:var(--text2)}
.ped-rbtn:hover{border-color:var(--teal);color:var(--teal)}
.ped-rbtn.unsat{background:#fee2e2;border-color:#fca5a5;color:#b91c1c}
.ped-rbtn.sat{background:#fef9c3;border-color:#fde68a;color:#b45309}
.ped-rbtn.sup{background:#dcfce7;border-color:#86efac;color:#15803d}
.ped-level-grid{display:grid;gap:8px;margin-top:7px}
.ped-lv-card{border:1.5px solid var(--border);border-radius:8px;padding:10px;cursor:pointer;transition:.15s;background:#fff}
.ped-lv-card:hover{border-color:var(--teal)}
.ped-lv-card.sel{background:#ccfbf1;border-color:var(--teal)}
.ped-lv-num{font-size:16px;font-weight:700;color:var(--text2);margin-bottom:4px}
.ped-lv-card.sel .ped-lv-num{color:var(--teal2)}
.ped-lv-desc{font-size:11px;color:var(--text2);line-height:1.45}
.ped-lv-card.sel .ped-lv-desc{color:var(--teal2)}
.ped-cbgroup{display:flex;gap:6px;flex-wrap:wrap}
.ped-cb-opt{display:flex;align-items:center;gap:5px;padding:5px 10px;border:1.5px solid var(--border2);border-radius:6px;font-size:12px;cursor:pointer;color:var(--text2);background:#fff;transition:.15s;white-space:nowrap}
.ped-cb-opt:hover{border-color:var(--teal);color:var(--teal)}
.ped-cb-opt input{accent-color:var(--teal);cursor:pointer}
.ped-sig-done{padding:10px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;text-align:center}
.ped-peer-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)}
.ped-peer-row:last-child{border-bottom:none}
.ped-peer-scores{display:flex;gap:2px;flex-shrink:0}
.ped-score-lbl{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.ped-score-radio{display:none}
.ped-score-num{width:22px;height:22px;border:1px solid var(--border2);border-radius:4px;background:#fff;font-size:10px;font-weight:600;color:var(--text3);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.12s}
.ped-score-radio:checked+.ped-score-num{background:var(--teal);border-color:var(--teal);color:#fff}
.ped-score-lbl:hover .ped-score-num{border-color:var(--teal);color:var(--teal)}
@media(max-width:700px){
  .ped-domain-row{flex-direction:column}
  .ped-domain-actions{width:100%}
  .ped-peer-scores{gap:1px}
  .ped-score-num{width:18px;height:18px;font-size:9px}
}
.rota-rotation-tabs{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:16px}
.rota-rtab{padding:7px 14px;border:1.5px solid var(--border2);border-radius:20px;background:#fff;font-size:12px;font-weight:600;cursor:pointer;color:var(--text2);transition:.2s;white-space:nowrap}
.rota-rtab.active{background:var(--teal);border-color:var(--teal);color:#fff}
.rota-rtab:hover:not(.active){border-color:var(--teal);color:var(--teal)}

.rota-card{background:#fff;border:1.5px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:14px}
.rota-card-hdr{padding:14px 18px;background:linear-gradient(135deg,var(--teal),#2dd4bf);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px}
.rota-card-ttl{font-size:15px;font-weight:700}
.rota-card-sub{font-size:12px;opacity:.85}

/* Score Stars */
.star-group{display:flex;gap:4px;align-items:center}
.star-btn{width:30px;height:30px;border:1.5px solid var(--border2);border-radius:6px;background:#fff;font-size:15px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;color:#d1d5db}
.star-btn.filled{background:#fef3c7;border-color:#f59e0b;color:#f59e0b}
.star-btn:hover{border-color:#f59e0b;background:#fef9c3}

/* Pass/Fail */
.pf-group{display:flex;gap:5px}
.pf-btn{padding:6px 14px;border:1.5px solid var(--border2);border-radius:6px;background:#fff;font-size:12px;font-weight:700;cursor:pointer;transition:.15s}
.pf-btn.pass{border-color:#16a34a;background:#dcfce7;color:#15803d}
.pf-btn.fail{border-color:#dc2626;background:#fee2e2;color:#b91c1c}
.pf-btn:not(.pass):not(.fail):hover{border-color:var(--teal);color:var(--teal)}

/* Domain row */
.domain-row{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border)}
.domain-row:last-child{border-bottom:none}
.domain-label{flex:1;font-size:13px;font-weight:500;color:var(--text)}
.domain-sublabel{font-size:11px;color:var(--text3);font-weight:400;display:block;margin-top:1px}
.domain-score{width:160px;flex-shrink:0}

/* Assessment record card */
.assess-rec{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;position:relative}
.assess-rec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.assess-rec-meta{font-size:11px;color:var(--text3)}
.assess-rec-rotation{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:12px;font-size:11px;font-weight:700;background:#ccfbf1;color:var(--teal2)}
.assess-signed{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;background:#dcfce7;color:#15803d}
.assess-pending{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;background:#fef3c7;color:#b45309}

/* Signature pad area */
.sig-area{border:2px dashed var(--border2);border-radius:10px;padding:16px;text-align:center;background:#fafbfc;cursor:pointer;transition:.2s}
.sig-area:hover{border-color:var(--teal);background:#f0fdfa}
.sig-area.signed{border-color:#16a34a;background:#f0fdf4;cursor:default}
.sig-canvas{border:1.5px solid var(--border2);border-radius:8px;cursor:crosshair;background:#fff;touch-action:none}

/* Overall summary badge */
.overall-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700}
.overall-badge.pass{background:#dcfce7;color:#15803d}
.overall-badge.fail{background:#fee2e2;color:#b91c1c}
.overall-badge.na{background:#f3f4f6;color:var(--text3)}

/* View assessment (resident/advisor view) */
.view-assess-card{background:#fff;border:1.5px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:14px}
.view-assess-hdr{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;border-bottom:1px solid var(--border)}
.view-domain-row{display:flex;align-items:center;justify-content:space-between;padding:9px 16px;border-bottom:1px solid #f0f2f5;flex-wrap:wrap;gap:6px}
.view-domain-row:last-child{border-bottom:none}
.stars-display{display:flex;gap:3px}
.star-disp{font-size:14px;color:#d1d5db}
.star-disp.lit{color:#f59e0b}
.unit-score-scroll{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px;scrollbar-gutter:stable}
.unit-score-table{width:100%;min-width:980px;border-collapse:collapse}
